summary: Create a resource Example
tags:
  - Examples
security:
  - Bearer: []
parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: The message content for the example
responses:
  201:
    description: Example created successfully
    schema:
      type: object
      properties:
        success:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
            message:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            deletedAt:
              type: string
              format: date-time
  400:
    description: Missing required field
    schema:
      type: object
      properties:
        error:
          type: string
  401:
    description: Unauthorized - missing or invalid token