summary: Soft deletion of a resource by ID
tags:
  - Examples
security:
  - Bearer: []
parameters:
  - name: id
    in: path
    type: integer
    required: true
    description: Example ID
responses:
  200:
    description: Example soft-deleted successfully
    schema:
      type: object
      properties:
        success:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
            message:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            deletedAt:
              type: string
              format: date-time
  404:
    description: Example not found
  500:
    description: Error deleting example
  401:
    description: Unauthorized - missing or invalid token