summary: Creating a user resource 
tags:
  - Authentication
# security:
#   - Bearer: []
parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Unique username for the user
        password:
          type: string
          description: Password for the user account
responses:
  201:
    description: User created successfully
    schema:
      type: object
      properties:
          success:
              type: string
              description: Success message
  400:
    description: Missing required fields
    schema:
        type: object
        properties:
            error:
                type: string